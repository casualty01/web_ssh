<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebSSH</title>
<script>
  // Apply the saved theme/sidebar-width before first paint to avoid a flash.
  (function () {
    try {
      var theme = localStorage.getItem('webssh-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      var w = parseInt(localStorage.getItem('webssh-sidebar-width'), 10);
      if (w && w >= 180 && w <= 560) document.documentElement.style.setProperty('--sidebar-width', w + 'px');
    } catch (_) {}
  })();
</script>
<link rel="stylesheet" href="vendor/xterm/css/xterm.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Login screen -->
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-box">
    <h1>WebSSH</h1>
    <input id="loginUser" type="text" placeholder="Username" autocomplete="username" required />
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
  <p id="buildVersionTag" class="build-version-tag"></p>
</div>

<!-- Main app -->
<div id="app" class="app hidden">
  <button id="sidebarToggle" class="sidebar-toggle" title="Collapse sidebar">‹</button>
  <div id="sidebarResizer" class="sidebar-resizer" title="Drag to resize"></div>
  <div class="sidebar">
    <div class="sidebar-search">
      <div class="sidebar-search-inner" id="sidebarSearchWrap">
        <span class="search-icon">🔍</span>
        <input id="sidebarSearch" type="text" placeholder="Search sessions & tunnels…" autocomplete="off" />
        <button id="btnSearchClear" class="search-clear" title="Clear search">✕</button>
      </div>
    </div>

    <div class="sidebar-header">
      <span>Sessions</span>
      <div class="sidebar-actions">
        <button title="New group" id="btnNewGroup">＋Group</button>
        <button title="New session" id="btnNewSession">＋Session</button>
      </div>
    </div>
    <div id="sessionTree" class="session-tree"></div>

    <div class="sidebar-header">
      <span>Tunnels</span>
      <div class="sidebar-actions">
        <button title="New tunnel" id="btnNewTunnel">＋Tunnel</button>
      </div>
    </div>
    <div id="tunnelList" class="tunnel-list"></div>

    <div class="sidebar-footer">
      <button id="btnLogout">Sign out</button>
      <button id="btnChangePassword" title="Change admin password">🔑</button>
      <button id="btnThemeToggle" title="Switch theme">🌙</button>
    </div>
    <p id="buildVersionTagApp" class="build-version-tag"></p>
  </div>

  <div class="main">
    <div class="tab-bar-row">
      <div id="tabBar" class="tab-bar"></div>
      <div class="tab-bar-controls" id="layoutToolbar">
        <button id="btnLayoutSingle" class="layout-btn active" title="Single pane" data-layout="single">□</button>
        <button id="btnLayoutH" class="layout-btn" title="Left / Right split" data-layout="horizontal">▥</button>
        <button id="btnLayoutV" class="layout-btn" title="Top / Bottom split" data-layout="vertical">▤</button>
        <button id="btnLayoutGrid" class="layout-btn" title="4-pane grid" data-layout="grid">▦</button>
      </div>
      <div class="tab-bar-controls">
        <button id="btnFullscreen" class="layout-btn" title="Full screen">⛶</button>
      </div>
    </div>
    <div id="terminals" class="terminals"></div>
    <div id="emptyState" class="empty-state">
      <p>Select a session on the left, or click <b>＋Session</b> to add one.</p>
    </div>
  </div>
</div>

<!-- Session edit dialog -->
<dialog id="sessionDialog" class="dialog">
  <form id="sessionForm" method="dialog">
    <h2 id="sessionDialogTitle">New Session</h2>
    <input type="hidden" id="sessId" />
    <label>Name <input id="sessName" required /></label>
    <label>Group
      <select id="sessGroup"><option value="">(none)</option></select>
    </label>
    <label>Host <input id="sessHost" required /></label>
    <label>Port <input id="sessPort" type="number" value="22" required /></label>
    <label>Username <input id="sessUser" required /></label>
    <label>Auth type
      <select id="sessAuthType">
        <option value="password">Password</option>
        <option value="privateKey">Private Key</option>
      </select>
    </label>
    <label id="sessPasswordRow">Password <input id="sessPassword" type="password" placeholder="(leave blank to keep existing)" /></label>
    <label id="sessKeyRow" class="hidden">Private Key (PEM) <textarea id="sessPrivateKey" rows="4" placeholder="(leave blank to keep existing)"></textarea></label>
    <label id="sessPassphraseRow" class="hidden">Key passphrase <input id="sessPassphrase" type="password" /></label>
    <label>Keepalive interval (seconds)
      <input id="sessKeepAlive" type="number" min="0" max="3600" step="1" value="30" placeholder="30" />
      <small class="field-hint">Sends an SSH keepalive probe this often so idle connections aren't dropped by NAT/firewalls, and dead links are detected. 0 = off.</small>
    </label>
    <div class="dialog-actions">
      <button type="button" id="sessCancel">Cancel</button>
      <button type="submit" id="sessSave">Save</button>
    </div>
  </form>
</dialog>

<!-- Group edit dialog -->
<dialog id="groupDialog" class="dialog">
  <form id="groupForm" method="dialog">
    <h2 id="groupDialogTitle">New Group</h2>
    <input type="hidden" id="groupId" />
    <label>Name <input id="groupName" required /></label>
    <div class="dialog-actions">
      <button type="button" id="groupCancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>

<!-- Tunnel edit dialog -->
<dialog id="tunnelDialog" class="dialog">
  <form id="tunnelForm" method="dialog">
    <h2>New Tunnel</h2>
    <input type="hidden" id="tunnelId" />
    <label>Name <input id="tunnelName" required /></label>
    <label>Via session
      <select id="tunnelSession" required></select>
    </label>
    <label>Type
      <select id="tunnelType">
        <option value="local">Local (-L)</option>
        <option value="remote">Remote (-R)</option>
        <option value="dynamic">Dynamic / SOCKS5 (-D)</option>
      </select>
    </label>
    <label>Listen host <input id="tunnelListenHost" value="127.0.0.1" required /></label>
    <label>Listen port <input id="tunnelListenPort" type="number" required /></label>
    <label id="tunnelTargetHostRow">Target host <input id="tunnelTargetHost" /></label>
    <label id="tunnelTargetPortRow">Target port <input id="tunnelTargetPort" type="number" /></label>
    <div class="dialog-actions">
      <button type="button" id="tunnelCancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>


<!-- Change admin password dialog -->
<dialog id="passwordDialog" class="dialog">
  <form id="passwordForm" method="dialog">
    <h2>Change Admin Password</h2>
    <label>Current password <input id="pwCurrent" type="password" autocomplete="current-password" required /></label>
    <label>New username <input id="pwNewUsername" type="text" autocomplete="username" placeholder="(leave blank to keep current)" /></label>
    <label>New password <input id="pwNewPassword" type="password" autocomplete="new-password" required minlength="6" /></label>
    <label>Confirm new password <input id="pwConfirmPassword" type="password" autocomplete="new-password" required minlength="6" /></label>
    <p id="pwError" class="error"></p>
    <div class="dialog-actions">
      <button type="button" id="pwCancel">Cancel</button>
      <button type="submit" id="pwSave">Save</button>
    </div>
  </form>
</dialog>

<script src="vendor/xterm/lib/xterm.js"></script>
<script src="vendor/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
